# Self-contained RAG stack: Ollama + model pull + RAG CLI.
#   docker compose run --rm rag ask "question"
# Stop the standalone local-ai-ollama container first: both use the
# local-ai-models volume. See README.md, "Docker stack".
x-ollama-image: &ollama-image ollama/ollama:0.40.3@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99

services:
  ollama:
    image: *ollama-image
    volumes:
      - models:/root/.ollama
    # No host port: rag reaches it on the compose network, so it cannot
    # clash with another Ollama on 127.0.0.1:11434.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  ollama-pull:
    image: *ollama-image
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${RAG_MODEL:-qwen3:4b-instruct-2507-q4_K_M}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag:
    build: .
    image: is2-local-ai-rag
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  models:
    # Reuse the volume that already holds the pulled models.
    name: local-ai-models
